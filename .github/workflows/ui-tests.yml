name: DLNA UI Tests

on:
  push:
    branches: [master]
    paths: ['app/src/**', '.github/workflows/ui-tests.yml']
  pull_request:
    paths: ['app/src/**', '.github/workflows/ui-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Download pinned test library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUST_TAG=$(sed -n 's/^rust_libs_version=//p' gradle.properties)
          mkdir -p app/src/main/jniLibs/x86_64
          gh release download "$RUST_TAG" -R KARAOKE-MASTER-ZJU/ktv-casting \
            -p libktv_casting_lib-x86_64.so -D app/src/main/jniLibs/x86_64
          mv app/src/main/jniLibs/x86_64/libktv_casting_lib-x86_64.so app/src/main/jniLibs/x86_64/libktv_casting_lib.so
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run DLNA Compose tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test-dlna-ui.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dlna-ui-results
          path: |
            ui-screenshots/*.png
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
